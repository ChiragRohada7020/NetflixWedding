<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Wedflix</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-black text-white overflow-y-auto">
  <div class="min-h-screen w-full flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-zinc-900 border border-zinc-700 rounded-2xl p-6 md:p-8">
      <h1 class="text-3xl font-bold mb-2">Login</h1>
      <p class="text-zinc-300 mb-6">Enter your account to continue.</p>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="space-y-2 mb-4">
            {% for category, message in messages %}
              <div class="{% if category == 'error' %}bg-red-500/20 border-red-400/50{% else %}bg-emerald-500/20 border-emerald-400/50{% endif %} border rounded p-2 text-sm">{{ message }}</div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      <form method="post" class="space-y-4">
        <input type="hidden" name="next" value="{{ request.args.get('next') or next_url or '' }}">
        <input name="email" type="email" required placeholder="Email" class="w-full p-3 rounded bg-zinc-800 border border-zinc-600" />
        <input name="password" type="password" required placeholder="Password" class="w-full p-3 rounded bg-zinc-800 border border-zinc-600" />
        <button type="submit" class="w-full bg-red-600 hover:bg-red-500 rounded p-3 font-semibold">Login</button>
      </form>

      <a href="{{ url_for('public.landing') }}" class="inline-block mt-5 text-sm text-zinc-300 hover:text-white">Back to Home</a>
    </div>
  </div>
</body>
</html>
