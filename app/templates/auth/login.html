{% extends 'base.html' %}
{% block content %}
<section class="max-w-md mx-auto mt-20 bg-white/5 p-8 rounded-xl">
  <h1 class="text-2xl font-bold mb-6">Login</h1>
  <form method="post" class="space-y-4">
    <input type="hidden" name="next" value="{{ request.args.get('next') or next_url or '' }}">
    <input class="w-full bg-black/40 border border-white/20 p-3 rounded" type="email" name="email" placeholder="Email" required>
    <input class="w-full bg-black/40 border border-white/20 p-3 rounded" type="password" name="password" placeholder="Password" required>
    <button class="w-full bg-ember p-3 rounded font-semibold" type="submit">Enter</button>
  </form>
</section>
{% endblock %}
