<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Wedflix</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            obsidian: '#0B0D12',
            ember: '#E50914'
          }
        }
      }
    }
  </script>
</head>
<body class="min-h-screen bg-obsidian text-white overflow-y-auto">
  <div class="min-h-screen px-4 py-10 md:py-16 flex items-start md:items-center justify-center">
    <div class="w-full max-w-md bg-white/5 border border-white/15 rounded-2xl p-6 md:p-8 shadow-2xl">
      <h1 class="text-2xl md:text-3xl font-black mb-2">Welcome Back</h1>
      <p class="text-gray-300 mb-6">Login to continue to WeddingFlix.</p>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="space-y-2 mb-4">
            {% for category, message in messages %}
              <div class="{% if category == 'error' %}bg-red-500/20 border-red-400/40{% else %}bg-emerald-500/20 border-emerald-400/40{% endif %} border text-sm rounded px-3 py-2">
                {{ message }}
              </div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      <form method="post" class="space-y-4">
        <input type="hidden" name="next" value="{{ request.args.get('next') or next_url or '' }}">
        <input class="w-full bg-black/40 border border-white/20 p-3 rounded-lg" type="email" name="email" placeholder="Email" required>
        <input class="w-full bg-black/40 border border-white/20 p-3 rounded-lg" type="password" name="password" placeholder="Password" required>
        <button class="w-full bg-ember p-3 rounded-lg font-semibold" type="submit">Login</button>
      </form>

      <a href="{{ url_for('public.landing') }}" class="inline-block mt-5 text-sm text-gray-300 hover:text-white">Back to home</a>
    </div>
  </div>
</body>
</html>
