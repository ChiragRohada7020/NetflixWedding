{% extends 'base.html' %}
{% block body_class %}hero-only-page{% endblock %}
{% block content %}
<section class="relative min-h-screen overflow-hidden hero-section hero-fullscreen">
  {% if wedding.hero_embed_url %}
    <iframe
      id="hero-video-iframe"
      data-video-audio="1"
      class="absolute inset-0 w-full h-full opacity-60 pointer-events-none hero-cover-video"
      src="{{ wedding.hero_embed_url }}?autoplay=1&mute=1&controls=0&loop=1&playlist={{ wedding.hero_video_id }}&playsinline=1&rel=0&iv_load_policy=3&disablekb=1&enablejsapi=1"
      title="Wedding trailer"
      allowfullscreen
    ></iframe>
  {% else %}
    <div class="absolute inset-0 bg-[radial-gradient(circle_at_20%_20%,rgba(229,9,20,0.35),transparent_40%),linear-gradient(120deg,#05070d,#0b1120,#05070d)]"></div>
  {% endif %}

  <div class="absolute top-0 left-0 right-0 h-24 bg-gradient-to-b from-black/85 to-transparent z-[1]"></div>
  <div class="absolute inset-0 bg-gradient-to-r from-black/70 via-black/30 to-black/70"></div>
  <div class="absolute inset-0 bg-gradient-to-t from-obsidian via-transparent to-black/15"></div>

  <div class="relative z-10 min-h-screen flex items-center justify-center px-6 md:px-16 hero-copy-shell">
    <div class="max-w-4xl text-center">
      <p class="text-6xl sm:text-7xl md:text-8xl lg:text-9xl leading-tight" style="font-family: 'Brush Script MT', cursive;">{{ wedding.couple_names }}</p>
      <h1 class="mt-1 text-[clamp(4.75rem,16vw,8.75rem)] font-black leading-[0.86] tracking-tight hero-main-title">Wedding<br>Invitation</h1>
      <div class="mt-6 flex flex-wrap items-center gap-3">
        <span class="bg-emerald-600 text-white px-5 py-2 rounded-full font-bold">Wedding Celebrated</span>
        <span class="text-lg text-gray-100">{{ wedding.wedding_date }}</span>
      </div>
      <div class="mt-4 flex flex-wrap gap-2 text-sm text-gray-200">
        <span class="bg-white/15 border border-white/20 px-4 py-2 rounded-full">Romantic</span>
        <span class="bg-white/15 border border-white/20 px-4 py-2 rounded-full">Family</span>
        <span class="bg-white/15 border border-white/20 px-4 py-2 rounded-full">Musical</span>
      </div>
    </div>
  </div>
</section>
{% endblock %}
