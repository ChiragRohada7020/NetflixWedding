{% extends 'base.html' %}
{% block content %}
<section class="relative min-h-screen overflow-hidden">
  <div id="netflix-intro" class="netflix-intro">
    <div class="netflix-intro-logo episode-intro-title">{{ episode.title }}</div>
  </div>
  <iframe
    id="episode-video-iframe"
    class="absolute inset-0 w-full h-full"
    src="{{ episode_video_url or episode.embed_url }}"
    title="Episode Video"
    allow="autoplay; encrypted-media; picture-in-picture"
    allowfullscreen
  ></iframe>
</section>

<section class="px-6 md:px-16 py-10">
  <h1 class="text-3xl font-black">{{ episode.title }}</h1>
  <p class="text-gray-300 mt-2">{{ episode.description }}</p>
  <div class="mt-5 flex gap-3">
    <button id="like-btn" data-episode="{{ episode._id }}" class="bg-white/10 px-4 py-2 rounded hover:bg-white/20">Like</button>
    <button onclick="navigator.share && navigator.share({title: '{{ episode.title }}', url: window.location.href})" class="bg-white/10 px-4 py-2 rounded hover:bg-white/20">Share</button>
  </div>

  <h2 class="text-2xl font-bold mb-4">Gallery</h2>
  <div class="columns-2 md:columns-4 gap-4 space-y-4">
    {% for photo in photos %}
      <img src="{{ photo.image_url }}" class="w-full rounded-lg cursor-pointer gallery-photo" alt="Photo">
    {% endfor %}
  </div>

  <h2 class="text-2xl font-bold mt-10 mb-4">Comments</h2>
  <form id="comment-form" data-episode="{{ episode._id }}" class="flex gap-3 mb-4">
    <input id="comment-input" class="flex-1 bg-white/10 p-3 rounded" placeholder="Write A Memory..." required>
    <button class="bg-ember px-5 rounded">Post</button>
  </form>
  <div id="comments-list" class="space-y-3">
    {% for c in comments %}
      <div class="bg-white/5 p-3 rounded">
        <p class="font-semibold">{{ c.user_name }}</p>
        <p class="text-gray-200">{{ c.text }}</p>
      </div>
    {% endfor %}
  </div>
</section>

<div id="lightbox" class="hidden fixed inset-0 bg-black/90 z-50 items-center justify-center p-4">
  <img id="lightbox-img" class="max-h-full max-w-full rounded" alt="preview">
</div>
{% endblock %}
